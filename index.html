<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><title>司機記帳</title><link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 16px 90px}header{display:flex;justify-content:space-between;align-items:center;margin:6px 0 18px}h1{font-size:25px;margin:0}.muted{color:#6b7280;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 2px 12px #0000000a}.kpi b{display:block;font-size:23px;margin-top:5px}.income{color:#087f5b}.expense{color:#d9480f}.profit{color:#2563eb}.section{margin-top:14px}.section h2{font-size:17px;margin:2px 0 10px}.type{display:flex;gap:8px;margin-bottom:12px}.type button{flex:1}.btn{border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}.btn.on{background:#111827;color:#fff}.btn.off{background:#e5e7eb}.primary{width:100%;background:#111827;color:white;margin-top:10px}.sync{width:100%;background:#2563eb;color:#fff;margin-top:8px}label{font-size:13px;color:#6b7280;display:block;margin:8px 0 5px}input,select{width:100%;border:1px solid #d1d5db;border-radius:11px;padding:11px;background:#fff;font-size:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.amount{font-size:23px;font-weight:700}.record{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.record:last-child{border:0}.record b{font-size:16px}.record small{display:block;color:#6b7280;margin-top:3px}.actions button{border:0;background:none;color:#6b7280;padding:5px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1;min-width:120px;background:#e5e7eb}.empty{text-align:center;color:#9ca3af;padding:22px 0}.status{margin-top:9px;padding:10px 12px;border-radius:11px;background:#eff6ff;color:#1d4ed8;font-size:13px;display:none}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body><div class="wrap">
<header><div><h1>🚕 司機記帳</h1><div class="muted" id="today"></div></div><div class="muted">資料儲存在此裝置</div></header>
<section class="grid"><div class="card kpi"><span class="muted">今日收入</span><b class="income" id="todayIncome">$0</b></div><div class="card kpi"><span class="muted">今日支出</span><b class="expense" id="todayExpense">$0</b></div><div class="card kpi"><span class="muted">今日淨利</span><b class="profit" id="todayProfit">$0</b></div><div class="card kpi"><span class="muted">本月淨利</span><b id="monthProfit">$0</b></div></section>
<section class="card section"><h2>快速記一筆</h2><div class="type"><button id="incomeBtn" class="btn on">＋ 收入</button><button id="expenseBtn" class="btn off">－ 支出</button></div><label>金額</label><input id="amount" class="amount" type="number" inputmode="decimal" placeholder="0"><div class="formgrid"><div><label>平台 / 分類</label><select id="category"></select></div><div><label>日期</label><input id="date" type="date"></div></div><div class="formgrid"><div><label>里程 km（選填）</label><input id="km" type="number" step="0.1" placeholder="0"></div><div><label>工時 hr（選填）</label><input id="hours" type="number" step="0.1" placeholder="0"></div></div><label>備註（選填）</label><input id="note" placeholder="例如：晚班、桃機單、加油"><button class="btn primary" id="save">儲存</button></section>
<section class="card section"><h2>運轉手帳本</h2><div class="muted">可匯入運轉手 5.x 的 JSON／同步快照資料；會自動合併並略過重複紀錄。</div><button class="btn sync" id="taxiImportBtn">匯入運轉手資料</button><input hidden type="file" id="taxiImportFile" accept=".json,.txt,.backup,application/json"><div class="status" id="taxiStatus"></div></section>
<section class="card section"><h2>本月效率</h2><div class="grid"><div><span class="muted">總收入</span><b id="mIncome">$0</b></div><div><span class="muted">總支出</span><b id="mExpense">$0</b></div><div><span class="muted">時薪</span><b id="hourly">$0</b></div><div><span class="muted">每公里淨利</span><b id="perKm">$0</b></div></div></section>
<section class="card section"><h2>最近紀錄</h2><div id="records"></div></section>
<section class="section toolbar"><button class="btn" id="exportJson">備份 JSON</button><button class="btn" id="exportCsv">匯出 CSV</button><button class="btn" id="importBtn">還原資料</button><input hidden type="file" id="importFile" accept="application/json"></section>
</div><script>
const K='driver-bookkeeping-v1';let type='income';let data=JSON.parse(localStorage.getItem(K)||'[]');const $=id=>document.getElementById(id),money=n=>'$'+Math.round(n||0).toLocaleString('zh-TW');const cats={income:['Uber','LINE GO','55688','現金','Uber Eats','foodpanda','其他收入'],expense:['油錢','過路費','停車費','洗車','保養維修','保險','車貸/租金','手機網路','耗材','其他支出']};
function setType(t){type=t;$('incomeBtn').className='btn '+(t==='income'?'on':'off');$('expenseBtn').className='btn '+(t==='expense'?'on':'off');$('category').innerHTML=cats[t].map(x=>`<option>${x}</option>`).join('')}function iso(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}$('date').value=iso();$('today').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('incomeBtn').onclick=()=>setType('income');$('expenseBtn').onclick=()=>setType('expense');setType('income');
$('save').onclick=()=>{let amount=+$('amount').value;if(!amount)return alert('請輸入金額');data.unshift({id:crypto.randomUUID?.()||String(Date.now()),type,amount,category:$('category').value,date:$('date').value,km:+$('km').value||0,hours:+$('hours').value||0,note:$('note').value.trim()});persist();['amount','km','hours','note'].forEach(x=>$(x).value='');render()};function persist(){localStorage.setItem(K,JSON.stringify(data))}function del(id){if(confirm('刪除這筆紀錄？')){data=data.filter(x=>String(x.id)!==String(id));persist();render()}}
function render(){let d=iso(),m=d.slice(0,7),td=data.filter(x=>x.date===d),md=data.filter(x=>x.date?.startsWith(m));let sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+(+x.amount||0),0);let ti=sum(td,'income'),te=sum(td,'expense'),mi=sum(md,'income'),me=sum(md,'expense'),hrs=md.reduce((s,x)=>s+(+x.hours||0),0),km=md.reduce((s,x)=>s+(+x.km||0),0);$('todayIncome').textContent=money(ti);$('todayExpense').textContent=money(te);$('todayProfit').textContent=money(ti-te);$('monthProfit').textContent=money(mi-me);$('mIncome').textContent=money(mi);$('mExpense').textContent=money(me);$('hourly').textContent=money(hrs?(mi-me)/hrs:0);$('perKm').textContent=money(km?(mi-me)/km:0);$('records').innerHTML=data.slice(0,30).map(x=>`<div class="record"><div><b class="${x.type}">${x.type==='income'?'+':'-'}${money(x.amount)}</b><small>${x.date} · ${esc(x.category||'未分類')}${x.note?' · '+esc(x.note):''}${x.km?' · '+x.km+'km':''}${x.hours?' · '+x.hours+'hr':''}</small></div><div class="actions"><button onclick="del('${String(x.id).replaceAll("'",'')}')">刪除</button></div></div>`).join('')||'<div class="empty">還沒有紀錄，先記第一筆吧</div>'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function download(name,text,mime){let u=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('exportJson').onclick=()=>download('bookkeeping-backup.json',JSON.stringify(data,null,2),'application/json');$('exportCsv').onclick=()=>{let rows=[['日期','類型','分類','金額','里程','工時','備註'],...data.map(x=>[x.date,x.type,x.category,x.amount,x.km,x.hours,x.note])];download('bookkeeping.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x))throw 0;if(confirm('以備份資料取代目前紀錄？')){data=x;persist();render()}}catch{alert('備份檔格式不正確')}e.target.value=''};
// 運轉手 5.x ledger adapter. 支援同步 snapshot / cloud_sync_records / record_json 與一般巢狀 JSON。
function dateOnly(v){if(!v)return iso();if(typeof v==='number'){let d=new Date(v<1e12?v*1000:v);return isNaN(d)?iso():d.toISOString().slice(0,10)}let s=String(v);let m=s.match(/\d{4}[-\/]\d{1,2}[-\/]\d{1,2}/);return m?m[0].replaceAll('/','-').split('-').map((x,i)=>i?x.padStart(2,'0'):x).join('-'):iso()}
function platformName(o){let p=o.platformType??o.platform??o.platform_name??o.platformName??o.customPlatformName??o.custom_platform_name;if(p==null)return '運轉手';let s=String(p);let map={uber:'Uber',line:'LINE GO',linego:'LINE GO','55688':'55688',cash:'現金',ubereats:'Uber Eats',foodpanda:'foodpanda'};return map[s.toLowerCase().replace(/[^a-z0-9]/g,'')]||s}
function categoryName(o){return String(o.customCategoryName??o.categoryName??o.category??o.expenseType??o.expense_type??o.name??'其他支出')}
function parseJsonMaybe(x){if(typeof x!=='string')return x;try{return JSON.parse(x)}catch{return null}}
function collectLedger(root){let out=[],seen=new Set();function walk(x,hint=''){x=parseJsonMaybe(x);if(!x)return;if(Array.isArray(x)){x.forEach(v=>walk(v,hint));return}if(typeof x!=='object')return;let rt=String(x.record_type??x.recordType??x.type??hint||'');let payload=parseJsonMaybe(x.record_json??x.recordJson??x.payload??x.data)??x;let key=String(x.record_id??x.recordId??payload.id??payload.uuid??'');let deleted=x.deleted===true||x.deleted===1||payload.deleted===true;if(!deleted&&(rt.includes('ledger_income')||('fareAmount'in payload)||('originalFare'in payload))){let amount=+(payload.fareAmount??payload.originalFare??payload.amount??payload.income??0);if(amount>0){let fee=+(payload.platformFeeAmount??payload.platformFee??0);out.push({id:'taxiii:'+ (key||payload.createdAt||crypto.randomUUID()),type:'income',amount,category:platformName(payload),date:dateOnly(payload.dateTime??payload.date??payload.createdAt),km:+(payload.mileage??payload.distance??0)||0,hours:0,note:[payload.note??payload.memo,fee?`平台費 ${fee}`:''].filter(Boolean).join(' · '),source:'運轉手'})}}
else if(!deleted&&(rt.includes('ledger_expense')||('expense'in payload)||('expenseAmount'in payload))){let amount=+(payload.expense??payload.expenseAmount??payload.amount??0);if(amount>0)out.push({id:'taxiii:'+(key||payload.createdAt||crypto.randomUUID()),type:'expense',amount,category:categoryName(payload),date:dateOnly(payload.dateTime??payload.date??payload.createdAt),km:0,hours:0,note:String(payload.note??payload.memo??''),source:'運轉手'})}
else if(!deleted&&(rt.includes('ledger_time_clock')||payload.clockInTime||payload.clockOutTime)){let a=payload.clockInTime?new Date(payload.clockInTime):null,b=payload.clockOutTime?new Date(payload.clockOutTime):null;if(a&&!isNaN(a)){let hrs=b&&!isNaN(b)?Math.max(0,(b-a)/36e5):0,km=Math.max(0,+(payload.clockOutMileageKm??0)-+(payload.clockInMileageKm??0));out.push({id:'taxiii:clock:'+(key||payload.clockInTime),type:'income',amount:0,category:'工時',date:dateOnly(payload.clockInTime),km,hours:+hrs.toFixed(2),note:'運轉手工時',source:'運轉手',metaOnly:true})}}
Object.entries(x).forEach(([k,v])=>{if(v!==payload)walk(v,k)})}walk(root);return out.filter(x=>{let k=[x.id,x.type,x.amount,x.date,x.category,x.hours,x.km].join('|');if(seen.has(k))return false;seen.add(k);return true})}
function mergeTaxi(rows){let sig=x=>[x.type,+x.amount||0,x.date,x.category||'',+x.km||0,+x.hours||0,x.note||''].join('|'),existing=new Set(data.map(sig)),added=0;for(let r of rows){if(r.metaOnly){let match=data.find(x=>x.date===r.date&&(+x.hours||0)===0&&x.type==='income');if(match){match.hours=Math.max(+match.hours||0,r.hours);match.km=Math.max(+match.km||0,r.km);continue}}if(!existing.has(sig(r))){data.push(r);existing.add(sig(r));added++}}data.sort((a,b)=>String(b.date).localeCompare(String(a.date)));persist();render();return added}
$('taxiImportBtn').onclick=()=>$('taxiImportFile').click();$('taxiImportFile').onchange=async e=>{let f=e.target.files[0],st=$('taxiStatus');st.style.display='block';st.textContent='正在解析運轉手資料…';try{let text=await f.text();if(text.startsWith('TAXIII-BACKUP'))throw new Error('偵測到 TAXIII-BACKUP 封裝，這個版本先不要直接覆寫資料');let obj=JSON.parse(text),rows=collectLedger(obj);if(!rows.length)throw new Error('檔案中沒有找到可匯入的收入／支出／工時紀錄');let n=mergeTaxi(rows);st.textContent=`完成：辨識 ${rows.length} 筆，新增 ${n} 筆，重複資料已略過。`}catch(err){st.textContent='尚未匯入：'+err.message}e.target.value=''};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
</script></body></html>
