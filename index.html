<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>司機記帳</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px 16px 90px}header{display:flex;justify-content:space-between;align-items:center;margin:6px 0 18px}h1{font-size:25px;margin:0}.muted{color:#6b7280;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 2px 12px #0001}.kpi b{display:block;font-size:23px;margin-top:5px}.income{color:#087f5b}.expense{color:#d9480f}.profit{color:#2563eb}.section{margin-top:14px}.section h2{font-size:17px;margin:2px 0 10px}.type,.row{display:flex;gap:8px}.type button,.row>*{flex:1}.btn{border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;cursor:pointer}.on,.primary{background:#111827;color:#fff}.off,.tool{background:#e5e7eb}.primary,.sync{width:100%;margin-top:9px}.sync{background:#2563eb;color:#fff}.sync2{background:#0f766e;color:#fff}label{font-size:13px;color:#6b7280;display:block;margin:8px 0 5px}input,select{width:100%;border:1px solid #d1d5db;border-radius:11px;padding:11px;background:#fff;font-size:16px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.amount{font-size:23px;font-weight:700}.record{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eee}.record small{display:block;color:#6b7280;margin-top:3px}.actions button{border:0;background:none;color:#6b7280}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1;min-width:110px}.empty{text-align:center;color:#9ca3af;padding:22px}.status{margin-top:9px;padding:10px 12px;border-radius:11px;background:#eff6ff;color:#1d4ed8;font-size:13px;display:none}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9ca3af;margin-right:6px}.ok{background:#16a34a}.bad{background:#dc2626}.taxiiigrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.mini{background:#f8fafc;border-radius:12px;padding:10px}.mini b{display:block;font-size:17px;margin-top:3px}.target{margin-top:10px;padding:10px;background:#f0fdf4;border-radius:12px;font-size:13px}.hidden{display:none}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}.taxiiigrid{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="wrap"><header><div><h1>🚕 司機記帳</h1><div class="muted" id="today"></div></div><div class="muted">資料儲存在此裝置</div></header><section class="grid"><div class="card kpi"><span class="muted">今日收入</span><b class="income" id="todayIncome">$0</b></div><div class="card kpi"><span class="muted">今日支出</span><b class="expense" id="todayExpense">$0</b></div><div class="card kpi"><span class="muted">今日淨利</span><b class="profit" id="todayProfit">$0</b></div><div class="card kpi"><span class="muted">本月淨利</span><b id="monthProfit">$0</b></div></section><section class="card section"><h2>快速記一筆</h2><div class="type"><button id="incomeBtn" class="btn on">＋ 收入</button><button id="expenseBtn" class="btn off">－ 支出</button></div><label>金額</label><input id="amount" class="amount" type="number" inputmode="decimal" placeholder="0"><div class="formgrid"><div><label>平台 / 分類</label><select id="category"></select></div><div><label>日期</label><input id="date" type="date"></div></div><div class="formgrid"><div><label>里程 km</label><input id="km" type="number" step="0.1"></div><div><label>工時 hr</label><input id="hours" type="number" step="0.1"></div></div><label>備註</label><input id="note"><button class="btn primary" id="save">儲存</button></section><section class="card section"><h2>運轉手帳本</h2><div class="muted"><span id="bridgeDot" class="dot"></span><span id="bridgeText">正在檢查本機 Bridge…</span></div><label>裝置 ID（deviceId）</label><input id="taxiiiDeviceId" autocomplete="off" placeholder="xxxxxxxx-xxxx-4xxx-xxxx-xxxxxxxxxxxx"><div class="row"><button class="btn tool" id="bridgeCheck">檢查連線</button><button class="btn sync2" id="taxiiiSync">立即同步</button></div><button class="btn sync" id="taxiImportBtn">匯入運轉手備份檔</button><div class="muted" id="deviceIdHelp" style="margin-top:8px">deviceId 必須是運轉手帳本 installation ID（UUID v4）。Bridge 連線成功後才會進行雲端讀取。</div><input hidden type="file" id="taxiImportFile" accept=".json,.txt,.backup,.gz,.gzip,application/json,application/gzip"><div class="muted" id="taxiDropHint" style="margin-top:8px">也可以把運轉手備份檔直接拖到這個區塊。</div><div class="status" id="taxiStatus"></div><div id="taxiiiSummary" class="hidden"><div class="taxiiigrid"><div class="mini"><span class="muted">同步收入</span><b id="txIncome">$0</b></div><div class="mini"><span class="muted">平台費</span><b id="txFee">$0</b></div><div class="mini"><span class="muted">工時</span><b id="txHours">0 hr</b></div><div class="mini"><span class="muted">里程</span><b id="txKm">0 km</b></div><div class="mini"><span class="muted">加油量</span><b id="txFuel">0 L</b></div><div class="mini"><span class="muted">充電量</span><b id="txCharge">0 kWh</b></div><div class="mini"><span class="muted">小費</span><b id="txTip">$0</b></div><div class="mini"><span class="muted">同步筆數</span><b id="txCount">0</b></div></div><div class="target" id="txTarget"></div></div><div class="muted" style="margin-top:8px">同步為唯讀，不會修改運轉手帳本雲端資料。</div></section><section class="card section"><h2>本月效率</h2><div class="grid"><div><span class="muted">總收入</span><b id="mIncome">$0</b></div><div><span class="muted">總支出</span><b id="mExpense">$0</b></div><div><span class="muted">時薪</span><b id="hourly">$0</b></div><div><span class="muted">每公里淨利</span><b id="perKm">$0</b></div></div></section><section class="card section"><h2>最近紀錄</h2><div id="records"></div></section><section class="section toolbar"><button class="btn tool" id="exportJson">備份 JSON</button><button class="btn tool" id="exportCsv">匯出 CSV</button><button class="btn tool" id="importBtn">還原資料</button><input hidden type="file" id="importFile" accept="application/json"></section></div><script src="taxiii-sync-adapter.js"></script><script>const K='driver-bookkeeping-v1',DK='taxiii-device-id-v1';let type='income',data=JSON.parse(localStorage.getItem(K)||'[]');const $=id=>document.getElementById(id),money=n=>'$'+Math.round(n||0).toLocaleString('zh-TW'),cats={income:['Uber','LINE GO','55688','現金','Uber Eats','foodpanda','其他收入'],expense:['油錢','過路費','停車費','洗車','保養維修','保險','車貸/租金','手機網路','耗材','其他支出']};function iso(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`}function setType(t){type=t;$('incomeBtn').className='btn '+(t==='income'?'on':'off');$('expenseBtn').className='btn '+(t==='expense'?'on':'off');$('category').innerHTML=cats[t].map(x=>`<option>${x}</option>`).join('')}function persist(){localStorage.setItem(K,JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function del(id){if(confirm('刪除這筆紀錄？')){data=data.filter(x=>String(x.id)!==String(id));persist();render()}}function render(){let d=iso(),m=d.slice(0,7),td=data.filter(x=>x.date===d),md=data.filter(x=>x.date?.startsWith(m)),sum=(a,t)=>a.filter(x=>x.type===t).reduce((s,x)=>s+(+x.amount||0),0),ti=sum(td,'income'),te=sum(td,'expense'),mi=sum(md,'income'),me=sum(md,'expense'),hrs=md.reduce((s,x)=>s+(+x.hours||0),0),km=md.reduce((s,x)=>s+(+x.km||0),0);$('todayIncome').textContent=money(ti);$('todayExpense').textContent=money(te);$('todayProfit').textContent=money(ti-te);$('monthProfit').textContent=money(mi-me);$('mIncome').textContent=money(mi);$('mExpense').textContent=money(me);$('hourly').textContent=money(hrs?(mi-me)/hrs:0);$('perKm').textContent=money(km?(mi-me)/km:0);$('records').innerHTML=data.filter(x=>!x.metaOnly).slice(0,30).map(x=>`<div class="record"><div><b class="${x.type}">${x.type==='income'?'+':'-'}${money(x.amount)}</b><small>${x.date} · ${esc(x.category||'未分類')}${x.note?' · '+esc(x.note):''}${x.km?' · '+x.km+'km':''}${x.hours?' · '+x.hours+'hr':''}</small></div><div class="actions"><button onclick="del('${String(x.id).replaceAll("'",'')}')">刪除</button></div></div>`).join('')||'<div class="empty">還沒有紀錄</div>'}function mergeTaxi(rows){let byId=new Map(data.map((x,i)=>[String(x.id),i])),added=0,updated=0;for(const r of rows){let i=byId.get(String(r.id));if(i==null){data.push(r);byId.set(String(r.id),data.length-1);added++;continue}let old=data[i],isTaxiii=r.source==='運轉手'||String(r.id).startsWith('taxiii:')||old.source==='運轉手'||String(old.id).startsWith('taxiii:');if(isTaxiii){let merged={...old,...r};if(JSON.stringify(merged)!==JSON.stringify(old))updated++;data[i]=merged}else if(r.syncMeta&&JSON.stringify(old.syncMeta)!==JSON.stringify(r.syncMeta)){data[i]={...old,...r};updated++}}data.sort((a,b)=>String(b.date).localeCompare(String(a.date)));persist();render();return{added,updated}}function showTaxiii(rows,recordCount){let income=0,fee=0,tip=0,hours=0,km=0,fuel=0,charge=0,target=null;for(const r of rows){let t=r.taxiii||{};if(r.type==='income'&&!r.metaOnly){income+=+r.amount||0;fee+=+t.platformFeeAmount||0;tip+=+t.tip||0}if(r.syncMeta?.taxiiiRecordType==='ledger_time_clock'){hours+=+r.hours||0;km+=+r.km||0}if(r.syncMeta?.taxiiiRecordType==='ledger_expense'){fuel+=+t.fuelLiters||0;charge+=+t.chargingEnergyKwh||0}if(r.syncMeta?.taxiiiRecordType==='ledger_income_target')target=t}$('txIncome').textContent=money(income);$('txFee').textContent=money(fee);$('txTip').textContent=money(tip);$('txHours').textContent=hours.toFixed(1)+' hr';$('txKm').textContent=km.toFixed(1)+' km';$('txFuel').textContent=fuel.toFixed(1)+' L';$('txCharge').textContent=charge.toFixed(1)+' kWh';$('txCount').textContent=recordCount;$('txTarget').textContent=target?`收入目標：每日 ${money(target.dailyTarget)} ／ 每週 ${money(target.weeklyTarget)} ／ 每月 ${money(target.monthlyTarget)}`:'尚無收入目標資料';$('taxiiiSummary').classList.remove('hidden')}function status(s){$('taxiStatus').style.display='block';$('taxiStatus').textContent=s}function validTaxiiiDeviceId(id){return /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(String(id||''))}function validateSavedDeviceId(){let e=$('taxiiiDeviceId'),id=e.value.trim();if(!id)return;if(!validTaxiiiDeviceId(id)){localStorage.removeItem(DK);e.value='';status('已清除舊的錯誤 deviceId。請填入運轉手帳本 installation ID（UUID v4）。')}}async function checkBridge(){let h=await TaxiiiSync.bridgeHealth(),ok=!!h.ok;if(ok&&h.deviceId&&validTaxiiiDeviceId(h.deviceId)){let e=$('taxiiiDeviceId');if(!validTaxiiiDeviceId(e.value.trim())){e.value=h.deviceId;localStorage.setItem(DK,h.deviceId)}}$('bridgeDot').className='dot '+(ok?'ok':'bad');$('bridgeText').textContent=ok?(h.sessionReady?'Bridge 已連線，登入憑證已就緒':'Bridge 已連線，但尚未取得登入憑證'):'Bridge 尚未連線';return h}$('bridgeCheck').onclick=checkBridge;$('taxiiiSync').onclick=async()=>{let id=$('taxiiiDeviceId').value.trim();if(!id)return status('請先輸入 deviceId。');if(!validTaxiiiDeviceId(id))return status('deviceId 格式錯誤：必須是運轉手帳本的 UUID v4，例如 xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx；40 位 GitHub SHA 不能使用。');localStorage.setItem(DK,id);status('正在從運轉手帳本讀取同步資料…');try{let h=await checkBridge();if(!h.ok)throw new Error('本機 Bridge 未啟動');if(!h.sessionReady)throw new Error('Bridge 尚未取得目前登入工作階段憑證');let r=await TaxiiiSync.bridgePull(id,0,100,200),m=mergeTaxi(r.ledger);showTaxiii(r.ledger,r.records.length);status(`同步完成：雲端 ${r.records.length} 筆；新增 ${m.added}、更新 ${m.updated}。游標 ${r.nextCursor??'-'}。`)}catch(e){status('同步失敗：'+e.message)}};$('incomeBtn').onclick=()=>setType('income');$('expenseBtn').onclick=()=>setType('expense');$('save').onclick=()=>{let amount=+$('amount').value;if(!amount)return alert('請輸入金額');data.unshift({id:crypto.randomUUID?.()||String(Date.now()),type,amount,category:$('category').value,date:$('date').value,km:+$('km').value||0,hours:+$('hours').value||0,note:$('note').value.trim()});persist();['amount','km','hours','note'].forEach(x=>$(x).value='');render()};function download(name,text,mime){let u=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('exportJson').onclick=()=>download('bookkeeping-backup.json',JSON.stringify(data,null,2),'application/json');$('exportCsv').onclick=()=>{let rows=[['日期','類型','分類','金額','里程','工時','備註'],...data.filter(x=>!x.metaOnly).map(x=>[x.date,x.type,x.category,x.amount,x.km,x.hours,x.note])];download('bookkeeping.csv','\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n'),'text/csv')};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x))throw 0;if(confirm('以備份資料取代目前紀錄？')){data=x;persist();render()}}catch{alert('備份檔格式不正確')}e.target.value=''};async function importTaxiiiFile(f){if(!f)return;status('正在解析運轉手資料…');try{let parsed=await TaxiiiSync.readBackupFile(f),records=parsed.records||[],rows=parsed.ledger||[];if(!rows.length)throw new Error('此檔沒有可辨識的運轉手帳本資料');let m=mergeTaxi(rows);showTaxiii(rows,records.length);let v=parsed.metadata?.version?`；版本 ${parsed.metadata.version}`:'',i=parsed.integrity&&parsed.integrity!=='none'?`；完整性 ${parsed.integrity}`:'';status(`匯入完成：${rows.length} 筆；新增 ${m.added}、更新 ${m.updated}${v}${i}。`)}catch(err){status('尚未匯入：'+err.message)}}$('taxiImportBtn').onclick=()=>$('taxiImportFile').click();$('taxiImportFile').onchange=async e=>{await importTaxiiiFile(e.target.files[0]);e.target.value=''};let txSection=$('taxiImportBtn').closest('.card');['dragenter','dragover'].forEach(ev=>txSection.addEventListener(ev,e=>{e.preventDefault();$('taxiDropHint').textContent='放開即可匯入運轉手備份檔'}));['dragleave','drop'].forEach(ev=>txSection.addEventListener(ev,e=>{e.preventDefault();$('taxiDropHint').textContent='也可以把運轉手備份檔直接拖到這個區塊。'}));txSection.addEventListener('drop',e=>importTaxiiiFile(e.dataTransfer.files?.[0]));$('date').value=iso();$('today').textContent=new Date().toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('taxiiiDeviceId').value=localStorage.getItem(DK)||'';validateSavedDeviceId();setType('income');render();checkBridge();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>
