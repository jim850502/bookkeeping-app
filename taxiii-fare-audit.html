<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運轉手車資核對</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 12px #0001}h1{font-size:24px}.muted{color:#6b7280;font-size:13px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.k{background:#f8fafc;border-radius:12px;padding:10px}.k b{display:block;font-size:19px;margin-top:3px}.row{padding:12px 0;border-bottom:1px solid #eee}.line{display:flex;justify-content:space-between;gap:12px}.ok{color:#15803d}.bad{color:#b91c1c}.pill{font-size:12px;padding:2px 7px;border-radius:999px;background:#e5e7eb}button{width:100%;border:0;border-radius:12px;padding:12px;font-size:15px;font-weight:700;background:#111827;color:white}.empty{text-align:center;color:#9ca3af;padding:24px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="wrap"><h1>🚕 運轉手車資核對</h1><div class="card"><div class="muted">讀取「司機記帳」已匯入/同步的運轉手資料，不會寫回運轉手雲端。自訂平台依已解析的 FeeMethod 公式核對。</div><div class="grid" style="margin-top:12px"><div class="k">乘客車資<b id="fare">$0</b></div><div class="k">原平台費<b id="fee">$0</b></div><div class="k">司機實拿<b id="actual">$0</b></div><div class="k">可核對筆數<b id="count">0</b></div></div><div class="grid" style="margin-top:8px"><div class="k">重算平台費<b id="calcFee">$0</b></div><div class="k">重算實拿<b id="calcActual">$0</b></div><div class="k">吻合<b id="matched">0</b></div><div class="k">有差異<b id="mismatch">0</b></div></div></div><div class="card"><button onclick="location.href='./'">回司機記帳</button></div><div class="card"><b>逐筆核對</b><div id="rows"></div></div></div><script>const K='driver-bookkeeping-v1',money=n=>'$'+Math.round(Number(n)||0).toLocaleString('zh-TW'),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let data=[];try{data=JSON.parse(localStorage.getItem(K)||'[]')}catch{}let list=data.filter(r=>r.type==='income'&&!r.metaOnly&&r.taxiii);let sums={fare:0,fee:0,actual:0,calcFee:0,calcActual:0},audit=[];for(const r of list){const t=r.taxiii||{},q=t.reconciliation||{},fare=Number(q.passengerFare??t.fareAmount)||0,fee=Number(q.storedPlatformFee??t.platformFeeAmount)||0,actual=Number(q.storedActualIncome??t.actualIncome??r.amount)||0,cf=Number(q.computedPlatformFee),ca=Number(q.computedActualIncome),has=q.computedPlatformFee!=null&&q.computedActualIncome!=null&&Number.isFinite(cf)&&Number.isFinite(ca),fd=has?Number(q.platformFeeDelta):NaN,ad=has?Number(q.actualIncomeDelta):NaN,match=has?(q.feeMatched===true&&q.actualMatched===true):null;sums.fare+=fare;sums.fee+=fee;sums.actual+=actual;if(has){sums.calcFee+=cf;sums.calcActual+=ca;audit.push({...r,_fare:fare,_fee:fee,_actual:actual,_cf:cf,_ca:ca,_fd:fd,_ad:ad,_match:match})}}for(const k of ['fare','fee','actual','calcFee','calcActual'])document.getElementById(k).textContent=money(sums[k]);document.getElementById('count').textContent=audit.length;document.getElementById('matched').textContent=audit.filter(x=>x._match).length;document.getElementById('mismatch').textContent=audit.filter(x=>!x._match).length;document.getElementById('rows').innerHTML=audit.length?audit.sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(r=>`<div class="row"><div class="line"><b>${esc(r.date)} · ${esc(r.category)}</b><span class="pill ${r._match?'ok':'bad'}">${r._match?'吻合':'有差異'}</span></div><div class="muted" style="margin-top:6px">乘客 ${money(r._fare)} → 原平台費 ${money(r._fee)} → 原實拿 ${money(r._actual)}</div><div class="muted">重算平台費 ${money(r._cf)}（差 ${money(r._fd)}）→ 重算實拿 ${money(r._ca)}（差 ${money(r._ad)}）</div></div>`).join(''):'<div class="empty">目前沒有可核對資料。先在主頁匯入或同步運轉手資料；只有具備已解析抽成方法的自訂平台會進入核對。</div>';</script></body></html>
