<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運轉手同步</title><style>body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f3f4f6;margin:0;padding:18px;color:#111827}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 12px #0001}h1{font-size:22px}.muted{color:#6b7280;font-size:13px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:11px;font-size:16px;margin-top:8px}input{border:1px solid #d1d5db}button{border:0;background:#2563eb;color:white;font-weight:700}.secondary{background:#e5e7eb;color:#111827}.status{margin-top:12px;padding:12px;border-radius:11px;background:#eff6ff;white-space:pre-wrap}.ok{background:#ecfdf5}.bad{background:#fef2f2}</style></head><body><div class="card"><h1>運轉手帳本唯讀同步</h1><div class="muted">此頁只透過 127.0.0.1 本機 Bridge 讀取資料；Firebase 憑證不會存進此網頁。</div><button id="check" class="secondary">檢查本機 Bridge</button><input id="device" placeholder="deviceId（installationId）"><input id="cursor" type="number" min="0" value="0" placeholder="cursor"><button id="pull">讀取同步資料</button><div id="status" class="status">尚未檢查</div></div><script src="taxiii-sync-adapter.js"></script><script>
const $=id=>document.getElementById(id),status=(s,kind='')=>{$('status').textContent=s;$('status').className='status '+kind};
$('check').onclick=async()=>{status('檢查中…');const h=await TaxiiiSync.bridgeHealth();status(h.ok?(h.sessionReady?'Bridge 已連線，工作階段已就緒':'Bridge 已連線，但尚未取得登入工作階段憑證'):'無法連接 Bridge'+(h.error?'\n'+h.error:''),h.ok?'ok':'bad')};
$('pull').onclick=async()=>{const d=$('device').value.trim(),c=Number($('cursor').value||0);if(!d)return status('請輸入 deviceId','bad');try{status('同步中…');const r=await TaxiiiSync.bridgePull(d,c);sessionStorage.setItem('taxiii-last-sync',JSON.stringify(r.ledger));status(`同步完成\n雲端 records：${r.records.length}\n可匯入帳本：${r.ledger.length}\nheadSequence：${r.headSequence??'-'}\n結果暫存在 sessionStorage，關閉分頁即清除。`,'ok')}catch(e){status(String(e?.message||e),'bad')}};
</script></body></html>
