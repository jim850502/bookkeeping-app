name: Build AOTopsy

on:
  push:
    branches: [aotopsy-build]
    paths:
      - '.github/workflows/build-aotopsy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.4'
          cache: false
      - name: Fetch AOTopsy source
        run: git clone --depth 1 --branch v1.6.0 https://github.com/BroNils/aotopsy.git aotopsy
      - name: Build AOTopsy
        working-directory: aotopsy
        run: go build -trimpath -o ../aotopsy-linux-amd64 ./cmd/aotopsy
      - name: Smoke test
        run: ./aotopsy-linux-amd64 --help
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aotopsy-linux-amd64
          path: aotopsy-linux-amd64
          if-no-files-found: error
          retention-days: 1
