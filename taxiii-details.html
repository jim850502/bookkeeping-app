<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運轉手資料明細</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:0 2px 12px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi b{display:block;font-size:21px;margin-top:4px}.muted{color:#6b7280;font-size:13px}.record{padding:11px 0;border-bottom:1px solid #eee}.record:last-child{border:0}.income{color:#087f5b}.expense{color:#d9480f}button,input{width:100%;padding:12px;border-radius:11px;font-size:16px;margin-top:8px}button{border:0;background:#0f766e;color:#fff;font-weight:700}input{border:1px solid #d1d5db}.status{padding:10px;background:#eff6ff;border-radius:11px;margin-top:9px;white-space:pre-wrap}@media(min-width:600px){.grid{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="wrap"><div class="card"><h2>運轉手帳本資料明細</h2><div class="muted">唯讀同步；顯示已驗證的 5.0.2 欄位。</div><input id="device" placeholder="deviceId"><button id="sync">立即讀取</button><div id="status" class="status">尚未同步</div></div><div class="card"><div class="grid"><div class="kpi"><span class="muted">收入</span><b id="income">$0</b></div><div class="kpi"><span class="muted">支出</span><b id="expense">$0</b></div><div class="kpi"><span class="muted">工時</span><b id="hours">0 hr</b></div><div class="kpi"><span class="muted">里程</span><b id="km">0 km</b></div></div></div><div class="card"><h3>收入目標</h3><div id="target" class="muted">尚無資料</div></div><div class="card"><h3>最近資料</h3><div id="records" class="muted">尚無資料</div></div></div><script src="taxiii-sync-adapter.js"></script><script>const $=x=>document.getElementById(x),money=n=>'$'+Math.round(+n||0).toLocaleString('zh-TW'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));$('device').value=localStorage.getItem('taxiii-device-id-v1')||'';$('sync').onclick=async()=>{let d=$('device').value.trim();if(!d)return $('status').textContent='請輸入 deviceId';localStorage.setItem('taxiii-device-id-v1',d);try{$('status').textContent='同步中…';let h=await TaxiiiSync.bridgeHealth();if(!h.ok)throw Error('本機 Bridge 未啟動');if(!h.sessionReady)throw Error('Bridge 尚未取得登入工作階段憑證');let r=await TaxiiiSync.bridgePull(d,0,100,200),rows=r.ledger,inc=rows.filter(x=>x.type==='income'&&!x.metaOnly).reduce((s,x)=>s+(+x.amount||0),0),exp=rows.filter(x=>x.type==='expense').reduce((s,x)=>s+(+x.amount||0),0),clocks=rows.filter(x=>x.category==='工時'),hrs=clocks.reduce((s,x)=>s+(+x.hours||0),0),km=clocks.reduce((s,x)=>s+(+x.km||0),0),target=rows.find(x=>x.category==='收入目標');$('income').textContent=money(inc);$('expense').textContent=money(exp);$('hours').textContent=hrs.toFixed(1)+' hr';$('km').textContent=km.toFixed(1)+' km';$('target').textContent=target?`日 ${money(target.taxiii.dailyTarget)} · 週 ${money(target.taxiii.weeklyTarget)} · 月 ${money(target.taxiii.monthlyTarget)}`:'尚無資料';$('records').innerHTML=rows.filter(x=>x.category!=='收入目標').sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,50).map(x=>{let t=x.taxiii||{},extra=[];if(t.platformFeeAmount)extra.push('平台費 '+money(t.platformFeeAmount));if(t.tip)extra.push('小費 '+money(t.tip));if(t.fuelLiters)extra.push('加油 '+t.fuelLiters+'L');if(t.chargingEnergyKwh)extra.push('充電 '+t.chargingEnergyKwh+'kWh');if(t.odometerKm)extra.push('里程表 '+t.odometerKm+'km');if(x.hours)extra.push(x.hours+'hr');if(x.km)extra.push(x.km+'km');return `<div class="record"><b class="${x.type}">${esc(x.category)}${x.amount?' · '+money(x.amount):''}</b><div>${esc(x.date)}${extra.length?' · '+esc(extra.join(' · ')):''}${x.note?' · '+esc(x.note):''}</div></div>`}).join('')||'尚無資料';$('status').textContent=`完成：雲端 ${r.records.length} 筆，已解析 ${rows.length} 筆；游標 ${r.nextCursor??'-'}`;}catch(e){$('status').textContent='同步失敗：'+e.message}};</script></body></html>
