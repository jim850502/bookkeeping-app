<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>運轉手同步診斷</title><style>body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;max-width:760px;margin:auto;padding:20px;background:#f3f4f6;color:#111827}.card{background:#fff;padding:18px;border-radius:16px;margin:12px 0}code,pre{word-break:break-all;white-space:pre-wrap}button{padding:12px;border:0;border-radius:10px;font-weight:700}.ok{color:#087f5b}.warn{color:#b45309}</style></head><body><h1>運轉手同步診斷</h1><div class="card"><b>安全模式：唯讀</b><p>此頁不提供 push，也不儲存 Firebase ID token 或 App Check token。</p></div><div class="card"><div>Adapter：<b id="adapter">檢查中</b></div><div>Backend：<code id="base"></code></div><div>Pull：<code id="pull"></code></div><div>Snapshot：<code id="snapshot"></code></div></div><div class="card"><b>目前進度</b><p>API client 已就位；下一個必要條件是確認官方客戶端的精確 pull/snapshot request body 與正常登入工作階段取得方式。未驗證前不猜 request schema，也不會要求你把 token 貼到網頁或 GitHub。</p></div><script src="taxiii-sync-adapter.js"></script><script>const a=window.TaxiiiSync;document.getElementById('adapter').textContent=a?'已載入':'載入失敗';document.getElementById('adapter').className=a?'ok':'warn';if(a){base.textContent=a.BASE;pull.textContent=a.EP.pull;snapshot.textContent=a.EP.snapshot}</script></body></html>
